server {
    listen 8080;
    server_name _;
    client_max_body_size 6m;

    # Next's existing chatbot route is not a FastAPI endpoint.
    location = /api/chat {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
    location = /health { proxy_pass http://api:8000/health; }
    location = /docs { return 307 /api/docs; }
    location = /openapi.json { return 307 /api/openapi.json; }
    location /static/ { proxy_pass http://api:8000; }
    location /uploads/ { proxy_pass http://api:8000; }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
