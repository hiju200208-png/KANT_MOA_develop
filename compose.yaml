name: kant-moa-p2
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kantmoa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: kantmoa
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kantmoa -d kantmoa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
